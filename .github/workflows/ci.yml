name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  # Avalonia ships breaking removals in patch releases (ShapedTextRun.IsReversed left in 12.0.5);
  # the weekly run catches a new Avalonia release breaking the already published packages.
  schedule:
    - cron: '0 4 * * 1'

jobs:
  # ─── Build & Test ──────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the line-length check can diff against the PR base.
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Plumix.Tests references only Plumix/Cupertino/Material/Sample. Building the CI filter
      # is what catches a parity pass breaking the F# DSL (Plumix.FSharp, Plumix.Elmish) or the
      # desktop host — otherwise they are compiled for the first time at tag/pack time.
      # Browser/Android/iOS hosts are excluded: they need workloads this runner does not have.
      - name: Build
        run: dotnet build src/Plumix.Ci.slnf -c Release

      # The suite pins debug-mode diagnostics text, so it runs in Debug — diagnostics elide their
      # debug bodies in profile/release builds, and a full Release run would fail ~120 goldens the
      # way Flutter's debug-only test suite would. The build-mode contract itself is covered by the
      # BuildModeGates test, which asserts the profile and release halves when built for those modes.
      - name: Test (Debug)
        run: |
          dotnet test src/Plumix.Tests/Plumix.Tests.csproj -c Debug --logger "console;verbosity=normal" \
            --logger trx --results-directory TestResults

      - name: Test (build-mode gates, Profile)
        run: |
          dotnet test src/Plumix.Tests/Plumix.Tests.csproj -c Profile --filter BuildModeGates \
            --logger trx --results-directory TestResults

      - name: Test (build-mode gates, Release)
        run: |
          dotnet test src/Plumix.Tests/Plumix.Tests.csproj -c Release --filter BuildModeGates \
            --logger trx --results-directory TestResults

      # dotnet test reports a failure where it happens, thousands of lines above its summary, which
      # names no test. This repeats every failed test with its message and stack at the end of the
      # log, as an annotation on the run page and in the step summary.
      - name: Failed tests
        if: failure()
        run: python3 scripts/report_failed_tests.py TestResults

      - name: Line length (new/edited lines)
        if: github.event_name == 'pull_request'
        run: scripts/check_line_length.sh "origin/${{ github.base_ref }}"

  # ─── Avalonia compatibility ────────────────────────────────────────────────
  # The test job runs on the minimum Avalonia (AvaloniaVersion in src/Directory.Packages.props) —
  # the version Plumix compiles against and the nuspec's lower bound. This job keeps the Plumix
  # assemblies built against that minimum and substitutes the newest stable Avalonia of the same
  # major at run time, which is what a consumer on a newer Avalonia gets. A removed or changed host
  # member then fails as MissingMethodException/TypeLoadException: HostBinaryCompatibilityTests binds
  # every Avalonia/SkiaSharp reference up front, the rest of the suite covers behavior changes.
  avalonia-compat:
    name: Avalonia compatibility (newest stable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Resolve newest stable Avalonia
        run: echo "AVALONIA_LATEST=$(scripts/latest_avalonia_version.sh)" >> "$GITHUB_ENV"

      - name: Test (Plumix built on the minimum, run on the newest Avalonia)
        run: |
          echo "Running against Avalonia $AVALONIA_LATEST"
          dotnet test src/Plumix.Tests/Plumix.Tests.csproj -c Debug \
            -p:AvaloniaTestVersion="$AVALONIA_LATEST" --logger trx --results-directory TestResults

      - name: Failed tests
        if: failure()
        run: python3 scripts/report_failed_tests.py TestResults

  # ─── Pack & Publish (tags only) ────────────────────────────────────────────
  publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest
    needs: [test, avalonia-compat]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    env:
      NUGET_OUTPUT: ${{ github.workspace }}/artifacts/nuget

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Plumix.Android targets net10.0-android; the runner image ships the Android SDK and a JDK.
      - name: Install Android workload
        run: dotnet workload install android

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NUGET_OUTPUT"
          dotnet pack src/Plumix/Plumix.csproj -c Release -p:Version="$PKG_VERSION" \
            --output "$NUGET_OUTPUT"
          dotnet pack src/Plumix.Material/Plumix.Material.csproj -c Release \
            -p:Version="$PKG_VERSION" --output "$NUGET_OUTPUT"
          dotnet pack src/Plumix.Cupertino/Plumix.Cupertino.csproj -c Release \
            -p:Version="$PKG_VERSION" --output "$NUGET_OUTPUT"
          dotnet pack src/Plumix.FSharp/Plumix.FSharp.fsproj -c Release \
            -p:Version="$PKG_VERSION" --output "$NUGET_OUTPUT"
          dotnet pack src/Plumix.Elmish/Plumix.Elmish.fsproj -c Release \
            -p:Version="$PKG_VERSION" --output "$NUGET_OUTPUT"
          dotnet pack src/Plumix.Android/Plumix.Android.csproj -c Release \
            -p:Version="$PKG_VERSION" --output "$NUGET_OUTPUT"

      - name: Push to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          package_ids=(
            "Plumix"
            "Plumix.Material"
            "Plumix.Cupertino"
            "Plumix.FSharp"
            "Plumix.Elmish"
            "Plumix.Android"
          )
          for package_id in "${package_ids[@]}"; do
            package="$NUGET_OUTPUT/${package_id}.${PKG_VERSION}.nupkg"
            if [[ ! -f "$package" ]]; then
              echo "::error::NuGet package was not created: $package"
              exit 1
            fi
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
