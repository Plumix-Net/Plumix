name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  # ─── Build & Test ──────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test
        run: dotnet test src/Plumix.Tests/Plumix.Tests.csproj -c Release --logger "console;verbosity=normal"

  # ─── Pack & Publish (tags only) ────────────────────────────────────────────
  publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    env:
      NUGET_OUTPUT: ${{ github.workspace }}/artifacts/nuget

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NUGET_OUTPUT"
          dotnet pack src/Plumix/Plumix.csproj -c Release -p:Version="$PKG_VERSION" \
            --output "$NUGET_OUTPUT"
          dotnet pack src/Plumix.Material/Plumix.Material.csproj -c Release \
            -p:Version="$PKG_VERSION" --output "$NUGET_OUTPUT"
          dotnet pack src/Plumix.Cupertino/Plumix.Cupertino.csproj -c Release \
            -p:Version="$PKG_VERSION" --output "$NUGET_OUTPUT"
          dotnet pack src/Plumix.FSharp/Plumix.FSharp.fsproj -c Release \
            -p:Version="$PKG_VERSION" --output "$NUGET_OUTPUT"
          dotnet pack src/Plumix.Elmish/Plumix.Elmish.fsproj -c Release \
            -p:Version="$PKG_VERSION" --output "$NUGET_OUTPUT"

      - name: Push to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          package_ids=(
            "Plumix"
            "Plumix.Material"
            "Plumix.Cupertino"
            "Plumix.FSharp"
            "Plumix.Elmish"
          )
          for package_id in "${package_ids[@]}"; do
            package="$NUGET_OUTPUT/${package_id}.${PKG_VERSION}.nupkg"
            if [[ ! -f "$package" ]]; then
              echo "::error::NuGet package was not created: $package"
              exit 1
            fi
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
